<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보험 약관, 쉽게 읽기</title>
  <!-- PDF.js 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 헤더 */
    .header {
      text-align: center;
      padding: 40px 20px;
      color: white;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    /* 메인 카드 */
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 15px;
    }

    .card-title .icon {
      font-size: 1.5rem;
    }

    /* 파일 업로드 영역 */
    .upload-area {
      border: 3px dashed #ddd;
      border-radius: 16px;
      padding: 50px 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #fafafa;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: #f0f4ff;
    }

    .upload-area.dragover {
      border-color: #667eea;
      background: #e8edff;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 10px;
    }

    .upload-hint {
      font-size: 0.9rem;
      color: #999;
    }

    .file-input {
      display: none;
    }

    /* 파일 정보 */
    .file-info {
      display: none;
      align-items: center;
      gap: 15px;
      padding: 20px;
      background: #e8f5e9;
      border-radius: 12px;
      margin-top: 20px;
    }

    .file-info.show {
      display: flex;
    }

    .file-icon {
      font-size: 2.5rem;
    }

    .file-details {
      flex: 1;
    }

    .file-name {
      font-weight: 700;
      color: #333;
      margin-bottom: 5px;
    }

    .file-size {
      font-size: 0.85rem;
      color: #666;
    }

    .file-remove {
      background: #ffebee;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      color: #e53935;
      font-weight: 600;
      transition: background 0.3s;
    }

    .file-remove:hover {
      background: #ffcdd2;
    }

    /* 로딩 */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #666;
      font-size: 1.1rem;
    }

    /* 진행바 */
    .progress-container {
      display: none;
      margin-top: 20px;
    }

    .progress-container.show {
      display: block;
    }

    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s;
    }

    .progress-text {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #666;
    }

    /* 결과 영역 */
    .result-section {
      display: none;
    }

    .result-section.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 탭 네비게이션 */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .tab-btn:hover {
      background: #f0f0f0;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    /* 약관 내용 */
    .clause-content {
      max-height: 600px;
      overflow-y: auto;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 12px;
      line-height: 2;
    }

    .clause-original {
      display: none;
    }

    .clause-original.show {
      display: block;
    }

    .clause-translated {
      display: none;
    }

    .clause-translated.show {
      display: block;
    }

    /* 문단 스타일 */
    .clause-paragraph {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      border-left: 4px solid #667eea;
    }

    .clause-paragraph-translated {
      margin-bottom: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 10px;
      border-left: 4px solid #4caf50;
    }

    .paragraph-number {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 8px;
    }

    /* 용어 하이라이트 */
    .term-highlight {
      background: #fff3e0;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: help;
      border-bottom: 2px dotted #ff9800;
    }

    .term-easy {
      background: #e8f5e9;
      padding: 2px 6px;
      border-radius: 4px;
      color: #2e7d32;
      font-weight: 600;
    }

    /* 통계 카드 */
    .stats-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-item {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #666;
      margin-top: 5px;
    }

    /* 용어 목록 */
    .terms-used {
      margin-top: 20px;
    }

    .terms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 15px;
      max-height: 300px;
      overflow-y: auto;
    }

    .term-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .term-original {
      font-weight: 600;
      color: #e53935;
      min-width: 80px;
      text-decoration: line-through;
    }

    .term-arrow {
      margin: 0 10px;
      color: #667eea;
    }

    .term-translated {
      color: #2e7d32;
      font-weight: 600;
    }

    /* 버튼 */
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    /* 푸터 */
    .footer {
      text-align: center;
      padding: 30px;
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
    }

    /* 반응형 */
    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .stats-card {
        grid-template-columns: 1fr;
      }

      .terms-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 샘플 PDF 안내 */
    .sample-section {
      margin-top: 20px;
      padding: 15px;
      background: #fff3e0;
      border-radius: 10px;
    }

    .sample-title {
      font-weight: 600;
      color: #e65100;
      margin-bottom: 10px;
    }

    .sample-text {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 10px;
    }

    .sample-btn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .sample-btn:hover {
      background: #f57c00;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <header class="header">
      <h1>📄 보험 약관, 쉽게 읽기</h1>
      <p>PDF 약관을 업로드하면 쉬운 말로 바꿔드려요</p>
    </header>

    <!-- 업로드 카드 -->
    <div class="card" id="uploadCard">
      <div class="card-title">
        <span class="icon">📤</span>
        보험 약관 PDF를 올려주세요
      </div>

      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📑</div>
        <div class="upload-text">PDF 파일을 여기에 드래그하거나 클릭하세요</div>
        <div class="upload-hint">보험 약관 PDF 파일 (최대 20MB)</div>
      </div>

      <input type="file" id="fileInput" class="file-input" accept=".pdf">

      <!-- 파일 정보 -->
      <div class="file-info" id="fileInfo">
        <div class="file-icon">📄</div>
        <div class="file-details">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
        <button class="file-remove" onclick="removeFile()">삭제</button>
      </div>

      <!-- 진행바 -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">PDF 분석 중...</div>
      </div>

      <!-- 로딩 -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">약관을 쉬운 말로 바꾸는 중...</div>
      </div>

      <!-- 샘플 안내 -->
      <div class="sample-section">
        <div class="sample-title">💡 PDF가 없으신가요?</div>
        <div class="sample-text">샘플 약관으로 먼저 체험해보세요!</div>
        <button class="sample-btn" onclick="loadSampleData()">샘플 약관으로 체험하기</button>
      </div>
    </div>

    <!-- 결과 섹션 -->
    <div class="result-section" id="resultSection">
      <!-- 통계 -->
      <div class="card">
        <div class="card-title">
          <span class="icon">📊</span>
          분석 결과
        </div>
        <div class="stats-card">
          <div class="stat-item">
            <div class="stat-number" id="statPages">0</div>
            <div class="stat-label">페이지</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="statTerms">0</div>
            <div class="stat-label">번역된 용어</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="statChars">0</div>
            <div class="stat-label">글자 수</div>
          </div>
        </div>
      </div>

      <!-- 약관 내용 -->
      <div class="card">
        <div class="card-title">
          <span class="icon">📖</span>
          약관 내용
        </div>

        <div class="tabs">
          <button class="tab-btn active" onclick="showTab('translated')">✨ 쉬운 말</button>
          <button class="tab-btn" onclick="showTab('original')">📄 원문</button>
          <button class="tab-btn" onclick="showTab('compare')">🔄 비교</button>
        </div>

        <div class="clause-content" id="clauseContent">
          <div class="clause-translated show" id="translatedContent"></div>
          <div class="clause-original" id="originalContent"></div>
          <div class="clause-compare" id="compareContent" style="display:none;"></div>
        </div>

        <div class="action-buttons">
          <button class="btn btn-secondary" onclick="copyToClipboard()">📋 복사하기</button>
          <button class="btn btn-secondary" onclick="downloadText()">💾 다운로드</button>
          <button class="btn btn-primary" onclick="resetAll()">🔄 다른 파일 분석</button>
        </div>
      </div>

      <!-- 사용된 용어 -->
      <div class="card">
        <div class="card-title">
          <span class="icon">📚</span>
          이 약관에서 바꾼 용어들
        </div>
        <div class="terms-grid" id="termsGrid"></div>
      </div>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
      <p>젊은 당신을 위한 새로운 보험 경험</p>
      <p style="margin-top: 5px; opacity: 0.7;">브랜드 리뉴얼 프로젝트</p>
    </footer>
  </div>

  <script>
    // PDF.js 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 용어 사전

      '납입기간': '돈 내는 기간',

      '부담보': '보장 안 해주는 것',

      '수술비': '수술하면 주는 돈',

      // 상태 관련
      '기왕증': '이미 있던 병',

      // 법률/행정 용어
      '준용': '똑같이 적용',
      '적용': '사용',
      '규정': '규칙',
      '조항': '내용',
      '전항': '위 내용',
      '본항': '이 내용',
      '동': '같은',
      '상기': '위의',
      '하기': '아래의',

      '기재': '적힌',
      '소정': '정해진',

      '경과': '지난',

      // 문장 패턴
      '및': '그리고',
      '또는': '혹은',
      '단': '다만',
      '의거': '따라',
      '으로 인하여': ' 때문에',
      '로 인하여': ' 때문에',
      '에 의하여': '에 따라',
      '에 한하여': '만',
      '하여야': '해야',
      '하였을': '했을',
      '아니합니다': '않아요',
      '있습니다': '있어요',
      '없습니다': '없어요',
      '됩니다': '돼요',
      '입니다': '이에요',
      '합니다': '해요',
      '않습니다': '않아요',
      '별도의 의사표시': '따로 말',
      '의사결정': '판단',
      '자유로운': '스스로',
    };

    // 전역 변수
    let originalText = '';
    let translatedText = '';
    let usedTerms = [];

    // 드래그 앤 드롭
    const uploadArea = document.getElementById('uploadArea');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type === 'application/pdf') {
        handleFile(file);
      } else {
        alert('PDF 파일만 업로드할 수 있어요!');
      }
    });

    // 파일 선택
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        handleFile(file);
      }
    });

    // 파일 처리
    async function handleFile(file) {
      // 파일 정보 표시
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = formatFileSize(file.size);
      document.getElementById('fileInfo').classList.add('show');
      document.getElementById('progressContainer').classList.add('show');

      try {
        // PDF 텍스트 추출
        const text = await extractTextFromPDF(file);
        originalText = text;

        // 번역
        document.getElementById('loading').classList.add('show');
        await new Promise(resolve => setTimeout(resolve, 500)); // UX를 위한 딜레이

        const result = translateClause(text);
        translatedText = result.translated;
        usedTerms = result.usedTerms;

        // 결과 표시
        displayResults(text, translatedText, usedTerms);

      } catch (error) {
        console.error('Error:', error);
        alert('PDF를 읽는 중 오류가 발생했어요. 다른 파일을 시도해주세요.');
      } finally {
        document.getElementById('loading').classList.remove('show');
        document.getElementById('progressContainer').classList.remove('show');
      }
    }

    // PDF 텍스트 추출
    async function extractTextFromPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = pdf.numPages;
      let fullText = '';

      for (let i = 1; i <= totalPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        fullText += pageText + '\n\n';

        // 진행률 업데이트
        const progress = Math.round((i / totalPages) * 100);
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressText').textContent = `PDF 분석 중... ${i}/${totalPages} 페이지`;
      }

      document.getElementById('statPages').textContent = totalPages;
      return fullText;
    }

    // 번역 함수
    function translateClause(text) {
      let translated = text;
      const usedTerms = [];

      // 긴 용어부터 먼저 치환
      const sortedTerms = Object.entries(termDictionary)
        .sort((a, b) => b[0].length - a[0].length);

      sortedTerms.forEach(([term, easy]) => {
        if (text.includes(term)) {
          translated = translated.split(term).join(easy);
          usedTerms.push({ original: term, easy: easy });
        }
      });

      return { translated, usedTerms };
    }

    // 결과 표시
    function displayResults(original, translated, terms) {
      // 통계 업데이트
      document.getElementById('statTerms').textContent = terms.length;
      document.getElementById('statChars').textContent = original.length.toLocaleString();

      // 원문 표시 (문단별로 나누기)
      const originalParagraphs = original.split('\n\n').filter(p => p.trim());
      const translatedParagraphs = translated.split('\n\n').filter(p => p.trim());

      // 원문
      document.getElementById('originalContent').innerHTML = originalParagraphs.map((p, i) => `
        <div class="clause-paragraph">
          <div class="paragraph-number">문단 ${i + 1}</div>
          ${p}
        </div>
      `).join('');

      // 번역문
      document.getElementById('translatedContent').innerHTML = translatedParagraphs.map((p, i) => `
        <div class="clause-paragraph-translated">
          <div class="paragraph-number">문단 ${i + 1}</div>
          ${p}
        </div>
      `).join('');

      // 비교 보기
      document.getElementById('compareContent').innerHTML = originalParagraphs.map((p, i) => `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
          <div class="clause-paragraph">
            <div class="paragraph-number">원문 ${i + 1}</div>
            ${p}
          </div>
          <div class="clause-paragraph-translated">
            <div class="paragraph-number">쉬운 말 ${i + 1}</div>
            ${translatedParagraphs[i] || ''}
          </div>
        </div>
      `).join('');

      // 사용된 용어
      const uniqueTerms = terms.filter((item, index, self) =>
        index === self.findIndex(t => t.original === item.original)
      );

      document.getElementById('termsGrid').innerHTML = uniqueTerms.map(term => `
        <div class="term-item">
          <span class="term-original">${term.original}</span>
          <span class="term-arrow">→</span>
          <span class="term-translated">${term.easy}</span>
        </div>
      `).join('');

      // 결과 섹션 표시
      document.getElementById('resultSection').classList.add('show');
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
    }

    // 탭 전환
    function showTab(tabName) {
      // 버튼 상태
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // 컨텐츠 상태
      document.getElementById('translatedContent').classList.remove('show');
      document.getElementById('originalContent').classList.remove('show');
      document.getElementById('compareContent').style.display = 'none';

      if (tabName === 'translated') {
        document.getElementById('translatedContent').classList.add('show');
      } else if (tabName === 'original') {
        document.getElementById('originalContent').classList.add('show');
      } else if (tabName === 'compare') {
        document.getElementById('compareContent').style.display = 'block';
      }
    }

    // 샘플 데이터 로드
    function loadSampleData() {
      const sampleText = `제1조(보험금의 지급사유)
회사는 피보험자가 보험기간 중에 다음 중 어느 하나의 사유가 발생한 경우에는 보험수익자에게 약정한 보험금을 지급합니다.

1. 사망보험금: 피보험자가 보험기간 중 사망하였을 때
2. 장해보험금: 피보험자가 보험기간 중 재해로 인하여 장해상태가 되었을 때

제2조(보험금을 지급하지 않는 사유)
회사는 다음 중 어느 하나에 해당되는 사유를 원인으로 하여 보험금 지급사유가 발생한 때에는 보험금을 지급하지 아니합니다.

1. 피보험자가 고의로 자신을 해친 경우. 단, 피보험자가 심신상실 등으로 자유로운 의사결정을 할 수 없는 상태에서 자신을 해친 경우에는 보험금을 지급합니다.
2. 보험수익자가 고의로 피보험자를 해친 경우
3. 보험계약자가 고의로 피보험자를 해친 경우

제3조(고지의무)
보험계약자 또는 피보험자는 청약시 청약서에서 질문한 사항에 대하여 알고 있는 사실을 반드시 사실대로 알려야 합니다. 고지의무를 위반한 경우 보험금 지급이 거절될 수 있습니다.

제4조(보험료의 납입)
보험계약자는 제1회 보험료를 청약시에 납입하여야 하며, 제2회 이후의 보험료는 납입기일까지 납입하여야 합니다.
보험료 납입이 연체되는 경우 납입최고(독촉)기간 내에 보험료를 납입하여야 합니다.

제5조(해약환급금)
보험계약자가 보험계약을 해지한 경우 회사는 해약환급금을 지급합니다.
단, 보험료를 납입한 기간이 1년 미만인 경우 해약환급금이 없거나 매우 적을 수 있습니다.
해약환급금은 책임준비금에서 소정의 공제액을 차감한 금액입니다.`;

      originalText = sampleText;
      const result = translateClause(sampleText);
      translatedText = result.translated;
      usedTerms = result.usedTerms;

      document.getElementById('statPages').textContent = '1';
      displayResults(sampleText, translatedText, usedTerms);
    }

    // 파일 삭제
    function removeFile() {
      document.getElementById('fileInput').value = '';
      document.getElementById('fileInfo').classList.remove('show');
    }

    // 초기화
    function resetAll() {
      document.getElementById('fileInput').value = '';
      document.getElementById('fileInfo').classList.remove('show');
      document.getElementById('resultSection').classList.remove('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 복사
    function copyToClipboard() {
      navigator.clipboard.writeText(translatedText).then(() => {
        alert('클립보드에 복사되었어요!');
      });
    }

    // 다운로드
    function downloadText() {
      const blob = new Blob([translatedText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '쉬운약관.txt';
      a.click();
      URL.revokeObjectURL(url);
    }

    // 파일 크기 포맷
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
  </script>
